minimum_prek_version = "0.4.13"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --project backend ruff check --config backend/pyproject.toml"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --project backend ruff format --check --config backend/pyproject.toml"
types = ["python"]

[[repos.hooks]]
id = "ty-check"
name = "ty check"
language = "system"
entry = "uv run --project backend ty check --project backend"
pass_filenames = false
files = "^backend/.*\\.py$"
